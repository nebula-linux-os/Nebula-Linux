---
efiSystemPartition: "/boot/efi"
userSwapChoices:
  - none
  - small
  - file
initialPartitioningChoice: erase
initialSwapChoice: small
drawNestedPartitions: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"
  - "xfs"

# /boot lives on its own small ext4 partition, OUTSIDE the btrfs root
# subvolume. Two reasons:
#   1. GRUB's ext4 driver is far more mature/battle-tested than its btrfs
#      driver. GRUB's btrfs.mod reading /boot/vmlinuz-linux out of the @
#      subvolume was observed failing with a low-level "premature end of
#      file" / testload "bad read" on a real disk, while listing the same
#      directory and reading smaller files worked fine — reproducible via
#      GRUB's own diagnostic tools, not something wrong with the kernel file
#      itself (verified byte-identical via checksum). Moving /boot off
#      btrfs entirely removes GRUB's btrfs code from the boot-critical path.
#   2. This is the standard, ArchWiki-recommended layout for btrfs root +
#      snapper anyway: keeping /boot OUTSIDE the snapshotted @ subvolume
#      means a snapper rollback can never revert the kernel/initramfs out
#      of sync with a rolled-back root filesystem.
# The EFI system partition is auto-prepended by Calamares ahead of this list.
partitionLayout:
    - name: "boot"
      type: "0fc63daf-8483-4772-8e79-3d69d8477de4"
      filesystem: "ext4"
      mountPoint: "/boot"
      size: 1GiB
    - name: "root"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
