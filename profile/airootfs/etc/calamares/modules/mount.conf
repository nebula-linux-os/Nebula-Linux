---
# Pseudo-filesystem bind mounts needed for target-environment (chroot)
# commands — mkinitcpio (initcpio module), grub-mkconfig/grub-install
# (grubcfg/bootloader modules) all need a working /proc, /sys, /dev.
# This is the exact upstream Calamares config (src/modules/mount/mount.conf),
# proven across many Arch-based Calamares distros. An earlier attempt at
# this hand-rolled a slightly different set (extra /dev/pts entry, missing
# the /run tmpfs mount that /run/udev needs to bind onto) and broke
# unpackfs — using the upstream-exact list avoids that.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Btrfs subvolume layout — snapper/snap-pac/grub-btrfs expect this shape.
# /var/log and /var/cache stay out of root snapshots so rollbacks keep logs.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
