---
# Explicit bind mounts into the target chroot. Some Calamares versions
# skip these by default, which makes shellprocess/initcpio fail with
# `==> ERROR: /proc must be mounted!` when mkinitcpio's autodetect
# hook runs inside the chroot. Listing them here guarantees they are
# present for every module that chroots into the target.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: /dev/pts
      fs: devpts
      mountPoint: /dev/pts
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

# Btrfs subvolume layout — snapper/snap-pac/grub-btrfs expect this shape.
# /var/log and /var/cache stay out of root snapshots so rollbacks keep logs.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
